<!DOCTYPE html>
<html>

<head>
    <title>Virus Game</title>
    <link rel="stylesheet" href="/gameplay_laptop/style.css">
</head>

<body>
    <div id="app"></div>
    <div class="game-container">
        <div class="top-bar">
            <div class="draw-pile">
                <div class="pile-icon">
                    <div class="pile-count" id="drawCount">36</div>
                </div>
                <div class="pile-label">Draw</div>
            </div>

            <div class="game-info">
                <span class="game-id-text" id="gameIDText">Game ID 1234</span>
                <span class="round-text" id="roundText">Round 3</span>
                <span class="player-text" id="playerText">Player 3</span>
            </div>

            <div class="rejected-pile">
                <div class="pile-icon">
                    <div class="pile-count" id="rejectedCount">15</div>
                </div>
                <div class="pile-label">Rejected</div>
            </div>
        </div>

        <div class="players-area">
        </div>


        <div class="start-game-overlay" id="startGameOverlay">
            <button class="start-game-btn" id="start-game-btn">Start Game</button>
        </div>
        <script type="module" src="/gameplay_laptop/gameplay_laptop.js"></script>
</body>

</html>
