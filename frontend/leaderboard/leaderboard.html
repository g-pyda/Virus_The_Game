<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="leaderboard-container">
        <h1 class="leaderboard-title">Leaderboard</h1>

        <div class="leaderboard-table">
            <div class="table-header">
                <div class="header-cell place-header">Place</div>
                <div class="header-cell name-header">Player name</div>
                <div class="header-cell games-header">Games won</div>
            </div>

            <div class="table-row rank-1">
                <div class="place-cell">1</div>
                <div class="name-cell" id="player-1">Player 1</div>
                <div class="games-cell" id="games-1">4</div>
            </div>

            <div class="table-row rank-2">
                <div class="place-cell">2</div>
                <div class="name-cell" id="player-2">Player 2</div>
                <div class="games-cell" id="games-2">3</div>
            </div>

            <div class="table-row rank-3">
                <div class="place-cell">3</div>
                <div class="name-cell" id="player-3">Player 3</div>
                <div class="games-cell" id="games-3">2</div>
            </div>

            <div class="table-row rank-4">
                <div class="place-cell">4</div>
                <div class="name-cell" id="player-4">Player 4</div>
                <div class="games-cell" id="games-4">1</div>
            </div>

            <div class="table-row rank-5">
                <div class="place-cell">5</div>
                <div class="name-cell" id="player-5">Player 5</div>
                <div class="games-cell" id="games-5">0</div>
            </div>
        </div>
    </div>
</body>
</html>
